<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Crop & Scan VIN/Lot</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  video, canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
  
  #targetFrame {
    position: absolute;
    border: 3px solid #ffca28;
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  /* CROP CONTAINER (ŞƏKLİ KƏSMƏK ÜÇÜN INTERFEYS) */
  #cropOverlay {
    display: none;
    position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,0.85);
    touch-action: none;
  }
  #cropCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  }
  #cropBox {
    position: absolute;
    border: 2px dashed #00ff9d;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
    background: rgba(0, 255, 157, 0.1);
    cursor: move;
  }
  .handle {
    position: absolute; width: 22px; height: 22px; background: #00ff9d;
    border-radius: 50%; border: 2px solid #000;
  }
  .handle-tl { top: -11px; left: -11px; cursor: nwse-resize; }
  .handle-tr { top: -11px; right: -11px; cursor: nesw-resize; }
  .handle-bl { bottom: -11px; left: -11px; cursor: nesw-resize; }
  .handle-br { bottom: -11px; right: -11px; cursor: nwse-resize; }

  #panel {
    position: absolute; left: 0; right: 0; bottom: calc(25px + env(safe-area-inset-bottom));
    padding: 0 20px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 15;
  }
  #status { 
    font-size: 14px; color: #ffecb3; text-align: center; font-weight: 700; 
    background: rgba(0,0,0,0.85); padding: 8px 16px; border-radius: 20px;
    max-width: 90%; word-break: break-all;
  }

  #actionContainer {
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .btn {
    width: 100%; padding: 15px 12px; font-size: 16px; font-weight: 800;
    border: none; border-radius: 14px; text-align: center; cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    transition: all 0.2s ease; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .btn:active { transform: scale(0.96); }

  #scanBtn { background: #ffca28; color: #000; font-size: 17px; padding: 18px 12px; }
  #cropConfirmBtn { display: none; background: #00ff9d; color: #000; font-size: 17px; padding: 18px 12px; }
  .bid-btn { background: #00ff9d; color: #000; }
  .google-btn { background: #4285F4; color: #fff; }
  .edit-btn { background: #ff9800; color: #fff; font-size: 14px; padding: 10px; }

  #retakeBtn {
    display: none; background: rgba(255,255,255,0.2); border: 1px solid #aaa;
    color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 4px;
  }

  #startOverlay {
    position: absolute; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 20; padding: 24px; text-align: center;
  }
  #startOverlay h1 { font-size: 24px; color: #ffca28; margin: 0; }
  #startOverlay p { font-size: 14px; color: #aaa; margin: 0; max-width: 300px; line-height: 1.5; }
  #startBtn {
    padding: 16px 40px; font-size: 18px; font-weight: 800; color: #000;
    background: #ffca28; border: none; border-radius: 14px; cursor: pointer;
  }
  #hiddenCanvas { display: none; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="hiddenCanvas"></canvas>
  
  <div id="targetFrame"></div>

  <!-- KƏSMƏ REJİMİ İNTARFEYSİ -->
  <div id="cropOverlay">
    <canvas id="cropCanvas"></canvas>
    <div id="cropBox">
      <div class="handle handle-tl" data-handle="tl"></div>
      <div class="handle handle-tr" data-handle="tr"></div>
      <div class="handle handle-bl" data-handle="bl"></div>
      <div class="handle handle-br" data-handle="br"></div>
    </div>
  </div>

  <div id="panel">
    <div id="status">📸 Şəkli çəkin</div>
    
    <div id="actionContainer">
      <button id="scanBtn" class="btn">📸 ŞƏKLİ ÇƏK</button>
      <button id="cropConfirmBtn" class="btn">✂️ SEÇİLƏN HİSSƏNİ ANALİZ ET</button>
      <div id="dynamicButtons" style="display:none; flex-direction:column; gap:8px;"></div>
    </div>
    
    <button id="retakeBtn">Yenidən Çək 🔄</button>
  </div>

  <div id="startOverlay">
    <h1>Crop & Scan Scanner 🚀</h1>
    <p>Dəqiq kəsmə və axtarış sistemi.</p>
    <button id="startBtn">Kameranı Aç</button>
  </div>
</div>

<script>
(function () {
  const video = document.getElementById('video');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const targetFrame = document.getElementById('targetFrame');
  const statusEl = document.getElementById('status');
  
  const scanBtn = document.getElementById('scanBtn');
  const cropConfirmBtn = document.getElementById('cropConfirmBtn');
  const dynamicButtons = document.getElementById('dynamicButtons');
  const retakeBtn = document.getElementById('retakeBtn');
  
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  const cropOverlay = document.getElementById('cropOverlay');
  const cropCanvas = document.getElementById('cropCanvas');
  const cropBox = document.getElementById('cropBox');

  let activeCode = "";
  let activeType = "";
  let capturedImgData = null;

  function layoutFrame() {
    const w = window.innerWidth, h = window.innerHeight;
    const frameW = Math.min(w * 0.90, 560);
    const frameH = frameW * 0.50; // Standart rahat çərçivə
    const left = (w - frameW) / 2, top = (h - frameH) / 2 - 60;
    targetFrame.style.width = frameW + 'px';
    targetFrame.style.height = frameH + 'px';
    targetFrame.style.left = left + 'px';
    targetFrame.style.top = top + 'px';
  }
  window.addEventListener('resize', layoutFrame);
  layoutFrame();

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  }

  // 1. ŞƏKLİ ÇƏKİRİK VƏ KƏSMƏ REJİMİNƏ KEÇİRİK
  scanBtn.addEventListener('click', () => {
    const vw = video.videoWidth, vh = video.videoHeight;
    const iw = window.innerWidth, ih = window.innerHeight;

    const scale = Math.max(iw / vw, ih / vh);
    const rect = targetFrame.getBoundingClientRect();

    const frameX = (rect.left - (iw - vw * scale) / 2) / scale;
    const frameY = (rect.top - (ih - vh * scale) / 2) / scale;
    const frameW = rect.width / scale;
    const frameH = rect.height / scale;

    cropCanvas.width = frameW;
    cropCanvas.height = frameH;
    const ctx = cropCanvas.getContext('2d');
    ctx.drawImage(video, frameX, frameY, frameW, frameH, 0, 0, frameW, frameH);

    video.pause();

    // Crop Rejimini aktiv edirik
    cropOverlay.style.display = 'block';
    targetFrame.style.display = 'none';
    scanBtn.style.display = 'none';
    cropConfirmBtn.style.display = 'flex';
    retakeBtn.style.display = 'block';

    statusEl.textContent = '✂️ Barmağınızla çərçivəni YALNIZ VIN/Lot üstünə gətirin';

    // Crop box-u mərkəzdə sıfırlayırıq
    const boxW = cropCanvas.clientWidth * 0.8;
    const boxH = cropCanvas.clientHeight * 0.4;
    cropBox.style.width = boxW + 'px';
    cropBox.style.height = boxH + 'px';
    cropBox.style.left = (cropCanvas.clientWidth - boxW) / 2 + 'px';
    cropBox.style.top = (cropCanvas.clientHeight - boxH) / 2 + 'px';
  });

  // BARMAQLA / SİÇANLA KƏSMƏ ÇƏRÇİVƏSİNİ İDARƏ ETMƏK
  let isDragging = false, currentHandle = null;
  let startX, startY, startL, startT, startW, startH;

  cropBox.addEventListener('pointerdown', (e) => {
    isDragging = true;
    currentHandle = e.target.dataset.handle || null;
    startX = e.clientX;
    startY = e.clientY;
    startL = cropBox.offsetLeft;
    startT = cropBox.offsetTop;
    startW = cropBox.offsetWidth;
    startH = cropBox.offsetHeight;
    cropBox.setPointerCapture(e.pointerId);
  });

  cropBox.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!currentHandle) {
      // Köçürmə (Drag)
      cropBox.style.left = Math.max(0, Math.min(cropCanvas.clientWidth - startW, startL + dx)) + 'px';
      cropBox.style.top = Math.max(0, Math.min(cropCanvas.clientHeight - startH, startT + dy)) + 'px';
    } else {
      // Ölçünü dəyişmə (Resize)
      if (currentHandle === 'br') {
        cropBox.style.width = Math.max(60, startW + dx) + 'px';
        cropBox.style.height = Math.max(30, startH + dy) + 'px';
      } else if (currentHandle === 'tl') {
        const nw = Math.max(60, startW - dx);
        const nh = Math.max(30, startH - dy);
        cropBox.style.width = nw + 'px';
        cropBox.style.height = nh + 'px';
        cropBox.style.left = (startL + (startW - nw)) + 'px';
        cropBox.style.top = (startT + (startH - nh)) + 'px';
      }
    }
  });

  cropBox.addEventListener('pointerup', () => { isDragging = false; });

  // 2. KƏSİLMİŞ HİSSƏNİ BAZAYA GÖNDƏR
  cropConfirmBtn.addEventListener('click', async () => {
    cropConfirmBtn.disabled = true;
    cropConfirmBtn.innerText = '⏳ ANALİZ EDİLİR...';
    statusEl.textContent = '🧠 Yalnız seçilmiş hissə oxunur...';

    // Canvas üzərindən seçilən x,y,w,h koordinatlarını götürürük
    const scaleX = cropCanvas.width / cropCanvas.clientWidth;
    const scaleY = cropCanvas.height / cropCanvas.clientHeight;

    const cropX = cropBox.offsetLeft * scaleX;
    const cropY = cropBox.offsetTop * scaleY;
    const cropW = cropBox.offsetWidth * scaleX;
    const cropH = cropBox.offsetHeight * scaleY;

    hiddenCanvas.width = cropW;
    hiddenCanvas.height = cropH;
    const ctx = hiddenCanvas.getContext('2d');
    ctx.drawImage(cropCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

    const blob = await new Promise(res => hiddenCanvas.toBlob(res, 'image/jpeg', 0.95));

    const { lot, vin } = await scanImageOnline(blob);

    cropOverlay.style.display = 'none';
    cropConfirmBtn.style.display = 'none';

    if (lot || vin) {
      if (lot) renderActionButtons(lot, 'LOT');
      else if (vin) renderActionButtons(vin, 'VIN');
    } else {
      statusEl.textContent = '❌ Kod tapılmadı. Zəhmət olmasa çərçivəni bir az genişləndirib təkrar yoxlayın.';
      scanBtn.innerText = '📸 YENİDƏN ŞƏKİL ÇƏK';
      scanBtn.style.display = 'flex';
      scanBtn.disabled = false;
      targetFrame.style.display = 'block';
    }
  });

  async function scanImageOnline(imageBlob) {
    const formData = new FormData();
    formData.append('file', imageBlob, 'photo.jpg');

    try {
      const response = await fetch('https://api.ocr.space/parse/image', {
        method: 'POST',
        headers: { 'apikey': 'K88383988888957' },
        body: formData
      });

      const data = await response.json();

      if (data && data.ParsedResults && data.ParsedResults.length > 0) {
        const text = data.ParsedResults[0].ParsedText;
        return extractCodesUniversal(text);
      }
    } catch (e) {
      console.error(e);
    }
    return { lot: null, vin: null };
  }

  // TƏMİZ / AÇAR SÖZSÜZ UNİVERSAL AXTARIŞ (Çünki zatən yalnız lazım olan hissəni kəsmişik)
  function extractCodesUniversal(text) {
    if (!text) return { lot: null, vin: null };
    const rawText = text.toUpperCase();

    let foundLot = null;
    let foundVin = null;

    // 1. Dəqiq 8 Rəqəm (Lot)
    const lotMatch = rawText.match(/\b\d{8}\b/) || rawText.match(/\d{8}/);
    if (lotMatch) foundLot = lotMatch[0];

    // 2. Dəqiq 17 Simvol (VIN)
    const cleanForVin = rawText.replace(/[^A-Z0-9]/g, '');
    const vinMatch = cleanForVin.match(/[A-HJ-NPR-Z0-9]{17}/);
    if (vinMatch && (!foundLot || !vinMatch[0].includes(foundLot))) {
      foundVin = vinMatch[0];
    }

    return { lot: foundLot, vin: foundVin };
  }

  function renderActionButtons(code, type) {
    activeCode = code;
    activeType = type;

    statusEl.textContent = `✅ ${type}: ${code}`;
    
    dynamicButtons.innerHTML = `
      <button id="editBtn" class="btn edit-btn">✏️ Kodu Düzəlt (${code})</button>
      <a class="btn bid-btn" href="https://bid.cars/en/search/archived/results?search-type=typing&query=${code}" target="_blank">🚀 Bid.cars-da Axtar</a>
      <a class="btn google-btn" href="https://www.google.com/search?q=${code}" target="_blank">🔍 Google-da Axtar</a>
    `;

    dynamicButtons.style.display = 'flex';

    document.getElementById('editBtn').addEventListener('click', () => {
      const newCode = prompt(`${type} kodunu dəyişin:`, activeCode);
      if (newCode !== null && newCode.trim() !== "") {
        const cleaned = newCode.trim().toUpperCase();
        renderActionButtons(cleaned, activeType);
      }
    });
  }

  retakeBtn.addEventListener('click', () => {
    video.play();
    statusEl.textContent = '📸 Şəkli çəkin';
    
    cropOverlay.style.display = 'none';
    targetFrame.style.display = 'block';

    scanBtn.style.display = 'flex';
    scanBtn.innerText = '📸 ŞƏKLİ ÇƏK';
    scanBtn.disabled = false;

    cropConfirmBtn.style.display = 'none';
    cropConfirmBtn.innerText = '✂️ SEÇİLƏN HİSSƏNİ ANALİZ ET';
    cropConfirmBtn.disabled = false;

    dynamicButtons.style.display = 'none';
    dynamicButtons.innerHTML = '';
    retakeBtn.style.display = 'none';
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    try {
      await startCamera();
      startOverlay.style.display = 'none';
      statusEl.textContent = '📸 Şəkli çəkin';
    } catch (err) {
      statusEl.textContent = 'Xəta: Kameraya icazə verilmədi.';
      startBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
