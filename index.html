<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fast Lot & VIN Scanner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  video, canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
  
  #targetFrame {
    position: absolute;
    border: 3px solid #ffca28;
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  #torchBtn {
    position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px;
    z-index: 10; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 20px; width: 44px; height: 44px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
    backdrop-filter: blur(5px);
  }

  #panel {
    position: absolute; left: 0; right: 0; bottom: calc(25px + env(safe-area-inset-bottom));
    padding: 0 20px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5;
  }
  #status { 
    font-size: 14px; color: #ffecb3; text-align: center; font-weight: 700; 
    background: rgba(0,0,0,0.85); padding: 8px 16px; border-radius: 20px;
    max-width: 90%; word-break: break-all;
  }

  #actionContainer {
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .btn {
    width: 100%; padding: 15px 12px; font-size: 16px; font-weight: 800;
    border: none; border-radius: 14px; text-align: center; cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    transition: all 0.2s ease; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .btn:active { transform: scale(0.96); }

  #scanBtn { background: #ffca28; color: #000; font-size: 17px; padding: 18px 12px; }
  .bid-btn { background: #00ff9d; color: #000; }
  .google-btn { background: #4285F4; color: #fff; }
  .copy-btn { background: #9c27b0; color: #fff; font-size: 14px; padding: 10px; }
  .edit-btn { background: #ff9800; color: #fff; font-size: 14px; padding: 10px; }

  #retakeBtn {
    display: none; background: rgba(255,255,255,0.2); border: 1px solid #aaa;
    color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 4px;
  }

  #startOverlay {
    position: absolute; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 20; padding: 24px; text-align: center;
  }
  #startOverlay h1 { font-size: 24px; color: #ffca28; margin: 0; }
  #startOverlay p { font-size: 14px; color: #aaa; margin: 0; max-width: 300px; line-height: 1.5; }
  #startBtn {
    padding: 16px 40px; font-size: 18px; font-weight: 800; color: #000;
    background: #ffca28; border: none; border-radius: 14px; cursor: pointer;
  }
  #hiddenCanvas { display: none; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="hiddenCanvas"></canvas>

  <button id="torchBtn" title="Fənər">🔦</button>
  <div id="targetFrame"></div>

  <div id="panel">
    <div id="status">📸 Lot nömrəsi və ya VIN kodu çərçivəyə salın</div>
    
    <div id="actionContainer">
      <button id="scanBtn" class="btn">📸 ŞƏKLİ ÇƏK VƏ ANALİZ ET</button>
      <div id="dynamicButtons" style="display:none; flex-direction:column; gap:8px;"></div>
    </div>
    
    <button id="retakeBtn">Yenidən Çək 🔄</button>
  </div>

  <div id="startOverlay">
    <h1>Lot & VIN Smart Scanner 🚀</h1>
    <p>İştirakçı sürətli və sadə axtarış tətbiqi.</p>
    <button id="startBtn">Kameranı Aç</button>
  </div>
</div>

<script>
(function () {
  const video = document.getElementById('video');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const targetFrame = document.getElementById('targetFrame');
  const statusEl = document.getElementById('status');
  
  const scanBtn = document.getElementById('scanBtn');
  const dynamicButtons = document.getElementById('dynamicButtons');
  const retakeBtn = document.getElementById('retakeBtn');
  const torchBtn = document.getElementById('torchBtn');
  
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  let videoTrack = null;
  let isTorchOn = false;
  let activeCode = "";
  let activeType = "";
  let isCameraStarted = false;

  function playSuccessSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {
      console.log('Audio icazəsi yoxdur');
    }
  }

  function layoutFrame() {
    const w = window.innerWidth, h = window.innerHeight;
    const frameW = Math.min(w * 0.90, 560);
    const frameH = frameW * 0.48;
    const left = (w - frameW) / 2, top = (h - frameH) / 2 - 60;
    targetFrame.style.width = frameW + 'px';
    targetFrame.style.height = frameH + 'px';
    targetFrame.style.left = left + 'px';
    targetFrame.style.top = top + 'px';
  }
  window.addEventListener('resize', layoutFrame);
  layoutFrame();

  async function startCamera() {
    try {
      // Köhnə aktiv stream varsa dayandırırıq ki, sıfırdan təmiz qoşulsun
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = stream;
      videoTrack = stream.getVideoTracks()[0];
      await video.play();
      isCameraStarted = true;
    } catch (err) {
      console.error("Kamera xətası:", err);
      statusEl.textContent = '❌ Kamera açıla bilmədi. İcazəni yoxlayın.';
    }
  }

  // TƏTBİQƏ GERİ QAYIDANDA KAMERANI AVTOMATİK BƏRPA ET
  async function restoreCameraIfNeeded() {
    if (isCameraStarted) {
      if (!video.srcObject || video.paused || video.ended) {
        await startCamera();
      } else {
        video.play().catch(() => {});
      }
    }
  }

  window.addEventListener('focus', restoreCameraIfNeeded);
  window.addEventListener('pageshow', restoreCameraIfNeeded);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      restoreCameraIfNeeded();
    }
  });

  torchBtn.addEventListener('click', async () => {
    if (!videoTrack) return;
    const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (capabilities.torch) {
      isTorchOn = !isTorchOn;
      await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
      torchBtn.style.background = isTorchOn ? '#ffca28' : 'rgba(0,0,0,0.6)';
      torchBtn.style.color = isTorchOn ? '#000' : '#fff';
    } else {
      alert('Bu cihazda fənər dəstəklənmir.');
    }
  });

  function captureFrameBlob() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const iw = window.innerWidth, ih = window.innerHeight;

    const scale = Math.max(iw / vw, ih / vh);
    const rect = targetFrame.getBoundingClientRect();

    const frameX = (rect.left - (iw - vw * scale) / 2) / scale;
    const frameY = (rect.top - (ih - vh * scale) / 2) / scale;
    const frameW = rect.width / scale;
    const frameH = rect.height / scale;

    hiddenCanvas.width = frameW;
    hiddenCanvas.height = frameH;
    const ctx = hiddenCanvas.getContext('2d');
    ctx.drawImage(video, frameX, frameY, frameW, frameH, 0, 0, frameW, frameH);

    return new Promise(resolve => hiddenCanvas.toBlob(resolve, 'image/jpeg', 0.90));
  }

  async function scanImageOnline(imageBlob) {
    statusEl.textContent = '🧠 Şəkil analiz olunur...';
    
    const formData = new FormData();
    formData.append('file', imageBlob, 'photo.jpg');

    try {
      const response = await fetch('https://api.ocr.space/parse/image', {
        method: 'POST',
        headers: { 'apikey': 'K88383988888957' },
        body: formData
      });

      const data = await response.json();

      if (data && data.ParsedResults && data.ParsedResults.length > 0) {
        const text = data.ParsedResults[0].ParsedText;
        return extractStrictCodes(text);
      }
    } catch (e) {
      console.error(e);
    }
    return { lot: null, vin: null };
  }

  function extractStrictCodes(text) {
    if (!text) return { lot: null, vin: null };
    const rawText = text.toUpperCase();
    
    let foundLot = null;
    let foundVin = null;

    const lotMatch = rawText.match(/\b\d{8}\b/) || rawText.match(/\d{8}/);
    if (lotMatch) foundLot = lotMatch[0];

    const cleanForVin = rawText.replace(/[^A-Z0-9]/g, '');
    const vinMatch = cleanForVin.match(/[A-HJ-NPR-Z0-9]{17}/);
    if (vinMatch && (!foundLot || !vinMatch[0].includes(foundLot))) {
      foundVin = vinMatch[0];
    }

    return { lot: foundLot, vin: foundVin };
  }

  function renderActionButtons(code, type) {
    activeCode = code;
    activeType = type;

    playSuccessSound();

    statusEl.textContent = `✅ ${type}: ${code}`;
    
    dynamicButtons.innerHTML = `
      <div style="display:flex; gap:8px;">
        <button id="editBtn" class="btn edit-btn" style="flex:1;">✏️ Düzəlt (${code})</button>
        <button id="copyBtn" class="btn copy-btn" style="flex:1;">📋 Kopyala</button>
      </div>
      <a class="btn bid-btn" href="https://bid.cars/en/search/archived/results?search-type=typing&query=${code}" target="_blank">🚀 Bid.cars-da Axtar</a>
      <a class="btn google-btn" href="https://www.google.com/search?q=${code}" target="_blank">🔍 Google-da Axtar</a>
    `;

    dynamicButtons.style.display = 'flex';

    document.getElementById('editBtn').addEventListener('click', () => {
      const newCode = prompt(`${type} kodunu dəyişin:`, activeCode);
      if (newCode !== null && newCode.trim() !== "") {
        const cleaned = newCode.trim().toUpperCase();
        renderActionButtons(cleaned, activeType);
      }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(activeCode);
      const originalText = document.getElementById('copyBtn').innerText;
      document.getElementById('copyBtn').innerText = '✅ Kopyalandı!';
      setTimeout(() => {
        if(document.getElementById('copyBtn')) document.getElementById('copyBtn').innerText = originalText;
      }, 1500);
    });
  }

  scanBtn.addEventListener('click', async () => {
    scanBtn.disabled = true;
    scanBtn.innerText = '⏳ ANALİZ EDİLİR...';
    statusEl.textContent = '📸 Şəkil çəkilir...';

    const imageBlob = await captureFrameBlob();
    video.pause();

    const { lot, vin } = await scanImageOnline(imageBlob);

    dynamicButtons.innerHTML = '';

    if (lot || vin) {
      scanBtn.style.display = 'none';

      if (lot) {
        renderActionButtons(lot, 'LOT');
      } else if (vin) {
        renderActionButtons(vin, 'VIN');
      }

    } else {
      statusEl.textContent = '❌ Kod tapılmadı. Yenidən çəkin.';
      scanBtn.innerText = '📸 YENİDƏN ŞƏKİL ÇƏK';
      scanBtn.disabled = false;
    }

    retakeBtn.style.display = 'block';
  });

  retakeBtn.addEventListener('click', async () => {
    await restoreCameraIfNeeded();
    statusEl.textContent = '📸 Lot nömrəsi və ya VIN kodu çərçivəyə salın';
    
    scanBtn.style.display = 'flex';
    scanBtn.innerText = '📸 ŞƏKLİ ÇƏK VƏ ANALİZ ET';
    scanBtn.disabled = false;

    dynamicButtons.style.display = 'none';
    dynamicButtons.innerHTML = '';
    retakeBtn.style.display = 'none';
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    try {
      await startCamera();
      startOverlay.style.display = 'none';
      statusEl.textContent = '📸 Lot nömrəsi və ya VIN kodu çərçivəyə salın';
    } catch (err) {
      statusEl.textContent = 'Xəta: Kameraya icazə verilmədi.';
      startBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
