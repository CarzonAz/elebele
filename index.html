<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pro Lot Scanner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
  
  #targetFrame {
    position: absolute;
    border: 2px dashed #ffca28;
    border-radius: 12px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.65);
    pointer-events: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #targetFrame.found {
    border-color: #00ff9d;
    border-style: solid;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.65), 0 0 25px rgba(0,255,157,0.8);
  }
  #scanLine {
    position: absolute; left: 2%; right: 2%; height: 2px;
    background: linear-gradient(90deg, transparent, #ffca28, transparent);
    top: 10%; pointer-events: none;
    animation: scanmove 2s ease-in-out infinite; opacity: 0.9;
  }
  @keyframes scanmove { 0% { top: 8%; } 50% { top: 92%; } 100% { top: 8%; } }

  #panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 16px 18px calc(22px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 80%);
    display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5;
  }
  #status { font-size: 14px; color: #ffecb3; text-align: center; font-weight: 600; }

  #codeInput {
    width: 100%; max-width: 420px; font-size: 26px; font-weight: 800; text-align: center;
    color: #00ff9d; background: rgba(0,0,0,0.7); border: 2px solid #00ff9d;
    border-radius: 12px; padding: 12px; letter-spacing: 3px; outline: none;
  }

  #actionBtn {
    width: 100%; max-width: 420px; padding: 16px 10px;
    font-size: 18px; font-weight: 800; color: #000; background: #ffca28;
    border: none; border-radius: 14px; text-decoration: none; text-align: center;
    box-shadow: 0 4px 20px rgba(255,202,40,0.4); cursor: pointer;
    display: block; transition: opacity 0.2s, transform 0.1s;
  }
  #actionBtn.disabled {
    opacity: 0.5; pointer-events: none; background: #666; box-shadow: none; color: #ccc;
  }

  .controls { display: flex; gap: 10px; width: 100%; max-width: 420px; }
  .ctrl-btn {
    flex: 1; background: rgba(255,255,255,0.15); border: 1px solid #666;
    color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
  }

  #startOverlay {
    position: absolute; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 20; padding: 24px; text-align: center;
  }
  #startOverlay h1 { font-size: 24px; color: #ffca28; margin: 0; }
  #startOverlay p { font-size: 14px; color: #aaa; margin: 0; max-width: 300px; line-height: 1.5; }
  #startBtn {
    padding: 16px 40px; font-size: 18px; font-weight: 800; color: #000;
    background: #ffca28; border: none; border-radius: 14px; cursor: pointer;
  }
  #topbar {
    position: absolute; top: env(safe-area-inset-top); left: 0; right: 0;
    padding: 14px 16px; z-index: 5; font-size: 13px; color: #ffca28; text-align: center; font-weight: 600;
  }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <div id="targetFrame"></div>
  <div id="scanLine"></div>

  <div id="topbar">📷 Lot kağızını çərçivəyə tutun (Saniyədə 1 dəfə oxunur)</div>

  <div id="panel">
    <div id="status">Kamera hazırlanır...</div>
    <input type="text" id="codeInput" placeholder="--------" maxlength="8" autocomplete="off">
    <a id="actionBtn" class="disabled" href="#" target="_blank" rel="noopener">Bid.cars-da Axtar 🚀</a>
    <div class="controls">
      <button id="torchBtn" class="ctrl-btn" style="display:none;">Fənər 🔦</button>
    </div>
  </div>

  <div id="startOverlay">
    <h1>Bid.cars Lot Scanner</h1>
    <p>Gömrük həyətindəki maşınların 8 rəqəmli Lot nömrələrini oxutmaq üçün başlayın.</p>
    <button id="startBtn">Kameranı Aç</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function () {
  const video = document.getElementById('video');
  const targetFrame = document.getElementById('targetFrame');
  const statusEl = document.getElementById('status');
  const codeInput = document.getElementById('codeInput');
  const actionBtn = document.getElementById('actionBtn');
  const torchBtn = document.getElementById('torchBtn');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  let worker = null;
  let scanning = false;
  let busy = false;
  let videoTrack = null;
  let torchOn = false;

  function layoutFrame() {
    const w = window.innerWidth, h = window.innerHeight;
    const frameW = Math.min(w * 0.90, 560);
    const frameH = frameW * 0.45;
    const left = (w - frameW) / 2, top = (h - frameH) / 2 - 30;
    targetFrame.style.width = frameW + 'px';
    targetFrame.style.height = frameH + 'px';
    targetFrame.style.left = left + 'px';
    targetFrame.style.top = top + 'px';
    document.getElementById('scanLine').style.left = left + 'px';
    document.getElementById('scanLine').style.width = frameW + 'px';
  }
  window.addEventListener('resize', layoutFrame);
  layoutFrame();

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    videoTrack = stream.getVideoTracks()[0];
    await video.play();

    const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (capabilities.torch) torchBtn.style.display = 'block';
  }

  torchBtn.addEventListener('click', async () => {
    if (!videoTrack) return;
    torchOn = !torchOn;
    await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
  });

  const ANGLES = [0, -15, 15];

  function getFrameCanvas() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const iw = window.innerWidth, ih = window.innerHeight;
    if (!vw || !vh) return null;

    const scale = Math.max(iw / vw, ih / vh);
    const rect = targetFrame.getBoundingClientRect();

    const frameX = (rect.left - (iw - vw * scale) / 2) / scale;
    const frameY = (rect.top - (ih - vh * scale) / 2) / scale;
    const frameW = rect.width / scale;
    const frameH = rect.height / scale;

    const canvas = document.createElement('canvas');
    canvas.width = frameW * 1.5;
    canvas.height = frameH * 1.5;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, frameX, frameY, frameW, frameH, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function processRotation(rawCanvas, angle) {
    if (angle === 0) return rawCanvas;
    const w = rawCanvas.width, h = rawCanvas.height;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.translate(w / 2, h / 2);
    ctx.rotate((angle * Math.PI) / 180);
    ctx.drawImage(rawCanvas, -w / 2, -h / 2);
    return canvas;
  }

  async function initWorker() {
    worker = await Tesseract.createWorker('eng', 1, { logger: () => {} });
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789', // Yalnızca rəqəmlər oxunur
      tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT
    });
  }

  // DƏQİQ 8 RƏQƏMİ TAPIR (Hərfi təmizləyir)
  function extractLotCode(text) {
    if (!text) return null;
    const digitsOnly = text.replace(/\D/g, ' '); // Rəqəm olmayan hər şeyi boşluq et
    const match = digitsOnly.match(/\b\d{8}\b/); // Dəqiq 8 rəqəmli bloku tap
    return match ? match[0] : null;
  }

  async function scanLoop() {
    if (!scanning || busy) return;
    busy = true;
    try {
      const rawCanvas = getFrameCanvas();
      if (rawCanvas) {
        for (const angle of ANGLES) {
          const rotated = processRotation(rawCanvas, angle);
          const result = await worker.recognize(rotated);
          const code = extractLotCode(result.data.text);

          if (code) {
            handleFound(code);
            break;
          }
        }
      }
    } catch (e) {}
    busy = false;
  }

  function startScanning() {
    scanning = true;
    statusEl.textContent = 'Skan edilir... Kağızı çərçivədə tutun';
    // Saniyədə 1 dəfə oxuyur (1000 ms)
    setInterval(scanLoop, 1000);
  }

  function handleFound(code) {
    targetFrame.classList.add('found');
    statusEl.textContent = '✅ 8 Rəqəmli Lot Tapıldı! Yoxlayın:';
    codeInput.value = code;
    updateUrl(code);

    setTimeout(() => {
      targetFrame.classList.remove('found');
    }, 800);
  }

  function updateUrl(code) {
    const cleanCode = code.replace(/\D/g, ''); // Təhlükəsizlik üçün yalnız rəqəm
    if (cleanCode.length === 8) {
      actionBtn.href = `https://bid.cars/en/search/archived/results?search-type=typing&query=${cleanCode}`;
      actionBtn.classList.remove('disabled');
    } else {
      actionBtn.classList.add('disabled');
    }
  }

  // İstifadəçi əllə dəyişə bilsin
  codeInput.addEventListener('input', () => {
    updateUrl(codeInput.value.trim());
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    statusEl.textContent = 'Kamera başladılır...';
    try {
      await startCamera();
      startOverlay.style.display = 'none';
      statusEl.textContent = 'Skaner hazırlanır...';
      await initWorker();
      startScanning();
    } catch (err) {
      statusEl.textContent = 'Xəta: Kameraya icazə verilmədi.';
      startBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
