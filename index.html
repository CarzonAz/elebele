<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI Lot Scanner Pro</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  video, canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
  
  #targetFrame {
    position: absolute;
    border: 2px solid #ffca28;
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.65);
    pointer-events: none;
    transition: all 0.3s ease;
  }

  #panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 16px 18px calc(22px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 85%);
    display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 5;
  }
  #status { font-size: 14px; color: #ffecb3; text-align: center; font-weight: 600; min-height: 24px; padding: 0 10px; }

  #codeInput {
    width: 100%; max-width: 420px; font-size: 28px; font-weight: 800; text-align: center;
    color: #00ff9d; background: rgba(0,0,0,0.8); border: 2px solid #00ff9d;
    border-radius: 14px; padding: 12px; letter-spacing: 4px; outline: none;
  }

  #shutterBtn {
    width: 76px; height: 76px; border-radius: 50%; background: #fff;
    border: 5px solid #ffca28; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 0 20px rgba(255,202,40,0.6);
    transition: transform 0.1s, background 0.2s, opacity 0.2s;
  }
  #shutterBtn:active { transform: scale(0.9); background: #ffca28; }
  #shutterBtn div { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #000; }
  #shutterBtn.loading { opacity: 0.5; pointer-events: none; }

  #actionBtn {
    width: 100%; max-width: 420px; padding: 16px 10px;
    font-size: 18px; font-weight: 800; color: #000; background: #ffca28;
    border: none; border-radius: 14px; text-decoration: none; text-align: center;
    box-shadow: 0 4px 20px rgba(255,202,40,0.4); cursor: pointer;
    display: block; transition: opacity 0.2s;
  }
  #actionBtn.disabled {
    opacity: 0.4; pointer-events: none; background: #555; box-shadow: none; color: #aaa;
  }

  .controls { display: flex; gap: 10px; width: 100%; max-width: 420px; }
  .ctrl-btn {
    flex: 1; background: rgba(255,255,255,0.15); border: 1px solid #666;
    color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
  }

  #startOverlay {
    position: absolute; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 20; padding: 24px; text-align: center;
  }
  #startOverlay h1 { font-size: 24px; color: #ffca28; margin: 0; }
  #startOverlay p { font-size: 14px; color: #aaa; margin: 0; max-width: 300px; line-height: 1.5; }
  #startBtn {
    padding: 16px 40px; font-size: 18px; font-weight: 800; color: #000;
    background: #ffca28; border: none; border-radius: 14px; cursor: pointer;
  }
  #topbar {
    position: absolute; top: env(safe-area-inset-top); left: 0; right: 0;
    padding: 14px 16px; z-index: 5; font-size: 13px; color: #ffca28; text-align: center; font-weight: 600;
  }
  #hiddenCanvas { display: none; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="hiddenCanvas"></canvas>
  
  <div id="targetFrame"></div>
  <div id="topbar">📸 Kağızı çərçivəyə salıb ŞƏKİL ÇƏKİN</div>

  <div id="panel">
    <div id="status">Kamera hazırlanır...</div>
    
    <input type="text" id="codeInput" placeholder="--------" maxlength="8" autocomplete="off">
    
    <button id="shutterBtn" title="Şəkli Çək"><div></div></button>
    
    <a id="actionBtn" class="disabled" href="#" target="_blank" rel="noopener">Bid.cars-da Axtar 🚀</a>
    
    <div class="controls">
      <button id="torchBtn" class="ctrl-btn" style="display:none;">Fənər 🔦</button>
      <button id="retakeBtn" class="ctrl-btn" style="display:none;">Yenidən Çək 🔄</button>
    </div>
  </div>

  <div id="startOverlay">
    <h1>AI Lot Scanner 🧠</h1>
    <p>Şəkli çəkin, Süni İntellekt xətasız 8 rəqəmli Lot kodunu tapsın.</p>
    <button id="startBtn">Kameranı Aç</button>
  </div>
</div>

<script>
(function () {
  const video = document.getElementById('video');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const targetFrame = document.getElementById('targetFrame');
  const statusEl = document.getElementById('status');
  const codeInput = document.getElementById('codeInput');
  const actionBtn = document.getElementById('actionBtn');
  const shutterBtn = document.getElementById('shutterBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const torchBtn = document.getElementById('torchBtn');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  let videoTrack = null;
  let torchOn = false;

  function layoutFrame() {
    const w = window.innerWidth, h = window.innerHeight;
    const frameW = Math.min(w * 0.90, 560);
    const frameH = frameW * 0.45;
    const left = (w - frameW) / 2, top = (h - frameH) / 2 - 40;
    targetFrame.style.width = frameW + 'px';
    targetFrame.style.height = frameH + 'px';
    targetFrame.style.left = left + 'px';
    targetFrame.style.top = top + 'px';
  }
  window.addEventListener('resize', layoutFrame);
  layoutFrame();

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    videoTrack = stream.getVideoTracks()[0];
    await video.play();

    const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (capabilities.torch) torchBtn.style.display = 'block';
  }

  torchBtn.addEventListener('click', async () => {
    if (!videoTrack) return;
    torchOn = !torchOn;
    await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
  });

  // ŞƏKLİ OPTİMİZASİYA EDİB KƏSMƏK (API sürətli cavab versin deyə kiçildirik)
  function captureOptimizedFrame() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const iw = window.innerWidth, ih = window.innerHeight;

    const scale = Math.max(iw / vw, ih / vh);
    const rect = targetFrame.getBoundingClientRect();

    const frameX = (rect.left - (iw - vw * scale) / 2) / scale;
    const frameY = (rect.top - (ih - vh * scale) / 2) / scale;
    const frameW = rect.width / scale;
    const frameH = rect.height / scale;

    // Maksimum ölçünü 800px-ə çəkirik (API dərhal emal etsin deyə)
    const maxDim = 800;
    let targetW = frameW;
    let targetH = frameH;
    
    if (frameW > maxDim) {
      targetW = maxDim;
      targetH = (frameH * maxDim) / frameW;
    }

    hiddenCanvas.width = targetW;
    hiddenCanvas.height = targetH;
    const ctx = hiddenCanvas.getContext('2d');
    ctx.drawImage(video, frameX, frameY, frameW, frameH, 0, 0, targetW, targetH);
    
    return hiddenCanvas.toDataURL('image/jpeg', 0.80);
  }

  // DƏQİQ XƏTA DİAQNOSTİKASI İLƏ AI API
  async function analyzeImageWithAI(base64Image) {
    statusEl.innerHTML = '🧠 AI Şəkli analiz edir... (Göndərilir)';
    statusEl.style.color = '#ffecb3';
    
    const formData = new FormData();
    formData.append('base64Image', base64Image);
    formData.append('language', 'eng');
    formData.append('isOverlayRequired', 'false');
    formData.append('OCREngine', '2');

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000); // 12 saniyə max gözləyir

      const response = await fetch('https://api.ocr.space/parse/image', {
        method: 'POST',
        headers: { 'apikey': 'helloworld' },
        body: formData,
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!response.ok) {
        throw new Error(`API Xətası: Server cavab vermədi (${response.status})`);
      }

      const result = await response.json();

      if (result.IsErroredOnProcessing) {
        const errDetail = result.ErrorMessage ? result.ErrorMessage[0] : 'Limit aşıldı';
        throw new Error(`API Sorğunu rədd etdi: ${errDetail}`);
      }

      if (result && result.ParsedResults && result.ParsedResults.length > 0) {
        const fullText = result.ParsedResults[0].ParsedText;
        return { success: true, code: extract8DigitLot(fullText) };
      }

      return { success: true, code: null };

    } catch (err) {
      if (err.name === 'AbortError') {
        return { success: false, error: 'XƏTA: İnternet zəifdir və ya API cavab vermədi.' };
      }
      return { success: false, error: err.message || 'Şəbəkə xətası baş verdi' };
    }
  }

  function extract8DigitLot(text) {
    if (!text) return null;
    const cleanText = text.replace(/[\r\n]+/g, ' ');
    const matches = cleanText.match(/\b\d{8}\b/g);
    if (matches && matches.length > 0) return matches[0];
    
    const altMatch = cleanText.match(/\d{8}/);
    return altMatch ? altMatch[0] : null;
  }

  // ŞƏKİL ÇƏKİLƏNDƏ
  shutterBtn.addEventListener('click', async () => {
    shutterBtn.classList.add('loading');
    shutterBtn.style.display = 'none';
    
    const imageData = captureOptimizedFrame();
    video.pause();

    const res = await analyzeImageWithAI(imageData);

    if (res.success) {
      if (res.code) {
        statusEl.innerHTML = '✅ <span style="color:#00ff9d">8 RƏQƏMLİ LOT TAPILDI!</span>';
        codeInput.value = res.code;
        updateUrl(res.code);
      } else {
        statusEl.innerHTML = '⚠️ Lot tapılmadı. Şəkli bir az daha yaxından çəkin.';
        statusEl.style.color = '#ffca28';
        codeInput.value = '';
        actionBtn.classList.add('disabled');
      }
    } else {
      // ƏSL XƏTANI EKRANA QIRMIZI İLƏ YAZIR (Artıq yalan demir!)
      statusEl.innerHTML = `<span style="color:#ff5252">${res.error}</span>`;
      codeInput.value = '';
      actionBtn.classList.add('disabled');
    }

    shutterBtn.classList.remove('loading');
    retakeBtn.style.display = 'block';
  });

  retakeBtn.addEventListener('click', () => {
    video.play();
    codeInput.value = '';
    actionBtn.classList.add('disabled');
    statusEl.innerHTML = 'Kağızı çərçivəyə salıb ŞƏKİL ÇƏKİN';
    statusEl.style.color = '#ffecb3';
    shutterBtn.style.display = 'flex';
    retakeBtn.style.display = 'none';
  });

  function updateUrl(code) {
    const cleanCode = code.replace(/\D/g, '');
    if (cleanCode.length === 8) {
      actionBtn.href = `https://bid.cars/en/search/archived/results?search-type=typing&query=${cleanCode}`;
      actionBtn.classList.remove('disabled');
    } else {
      actionBtn.classList.add('disabled');
    }
  }

  codeInput.addEventListener('input', () => {
    updateUrl(codeInput.value.trim());
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    statusEl.textContent = 'Kamera başladılır...';
    try {
      await startCamera();
      startOverlay.style.display = 'none';
      statusEl.textContent = 'Kağızı çərçivəyə salıb ŞƏKİL ÇƏKİN';
    } catch (err) {
      statusEl.textContent = 'Xəta: Kameraya icazə verilmədi.';
      startBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
