<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gemini AI Lot Scanner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  video, canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
  
  #targetFrame {
    position: absolute;
    border: 3px solid #ffca28;
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  /* Paneli YUXARI qaldırdıq */
  #panel {
    position: absolute; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom));
    padding: 0 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 5;
  }
  #status { 
    font-size: 15px; color: #ffecb3; text-align: center; font-weight: 700; 
    background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px;
  }

  /* ƏSAS ÇÖZÜM: Şəkil çəkmə, Lot Nömrəsi və Bid.cars Axtarış tək düymədə */
  #mainActionBtn {
    width: 100%; max-width: 400px; padding: 18px 15px;
    font-size: 18px; font-weight: 800; color: #000; background: #ffca28;
    border: none; border-radius: 16px; text-decoration: none; text-align: center;
    box-shadow: 0 6px 25px rgba(255,202,40,0.5); cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    transition: all 0.2s ease;
  }
  #mainActionBtn:active { transform: scale(0.96); }
  #mainActionBtn.searching { background: #00ff9d; box-shadow: 0 6px 25px rgba(0,255,157,0.6); }

  #retakeBtn {
    display: none; background: rgba(255,255,255,0.2); border: 1px solid #aaa;
    color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }

  #startOverlay {
    position: absolute; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 20; padding: 24px; text-align: center;
  }
  #startOverlay h1 { font-size: 24px; color: #ffca28; margin: 0; }
  #startOverlay p { font-size: 14px; color: #aaa; margin: 0; max-width: 300px; line-height: 1.5; }
  #startBtn {
    padding: 16px 40px; font-size: 18px; font-weight: 800; color: #000;
    background: #ffca28; border: none; border-radius: 14px; cursor: pointer;
  }
  #hiddenCanvas { display: none; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="hiddenCanvas"></canvas>
  
  <div id="targetFrame"></div>

  <div id="panel">
    <div id="status">📸 Çərçivəyə salıb düyməyə basın</div>
    
    <!-- YALNIZ BİR ƏSAS DÜYMƏ -->
    <button id="mainActionBtn">📸 ŞƏKLİ ÇƏK VƏ ANALİZ ET</button>
    
    <button id="retakeBtn">Yenidən Çək 🔄</button>
  </div>

  <div id="startOverlay">
    <h1>Google Gemini AI Scanner 🧠</h1>
    <p>Gündəlik 1500 şəkil limitli yüksək dəqiqlikli AI skaner.</p>
    <button id="startBtn">Kameranı Aç</button>
  </div>
</div>

<script>
(function () {
  // BURAYA PULSUZ GEMINI API AÇARINIZI QOYUN
  const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; 

  const video = document.getElementById('video');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const targetFrame = document.getElementById('targetFrame');
  const statusEl = document.getElementById('status');
  const mainActionBtn = document.getElementById('mainActionBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  let currentFoundLot = null;

  function layoutFrame() {
    const w = window.innerWidth, h = window.innerHeight;
    const frameW = Math.min(w * 0.90, 560);
    const frameH = frameW * 0.48;
    const left = (w - frameW) / 2, top = (h - frameH) / 2 - 80; // Çərçivəni də biraz yuxarı çəkdik
    targetFrame.style.width = frameW + 'px';
    targetFrame.style.height = frameH + 'px';
    targetFrame.style.left = left + 'px';
    targetFrame.style.top = top + 'px';
  }
  window.addEventListener('resize', layoutFrame);
  layoutFrame();

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  }

  function captureFrameBase64() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const iw = window.innerWidth, ih = window.innerHeight;

    const scale = Math.max(iw / vw, ih / vh);
    const rect = targetFrame.getBoundingClientRect();

    const frameX = (rect.left - (iw - vw * scale) / 2) / scale;
    const frameY = (rect.top - (ih - vh * scale) / 2) / scale;
    const frameW = rect.width / scale;
    const frameH = rect.height / scale;

    hiddenCanvas.width = frameW;
    hiddenCanvas.height = frameH;
    const ctx = hiddenCanvas.getContext('2d');
    ctx.drawImage(video, frameX, frameY, frameW, frameH, 0, 0, frameW, frameH);
    
    // Base64 prefiksini təmizləyirik
    return hiddenCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];
  }

  // GOOGLE GEMINI 1.5 FLASH PULSUZ AI ANALİZİ
  async function askGeminiAI(base64Data) {
    statusEl.textContent = '🧠 Google AI şəklə baxır...';
    
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
    
    const promptText = "Find the 8-digit car lot number in this image. Return ONLY the 8 digits. If there is a letter like X at the end, ignore it and return ONLY 8 numbers. If not found, return NONE.";

    const bodyData = {
      contents: [{
        parts: [
          { text: promptText },
          { inline_data: { mime_type: "image/jpeg", data: base64Data } }
        ]
      }]
    };

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
      });

      const data = await response.json();
      
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        const aiResponse = data.candidates[0].content.parts[0].text.trim();
        const digits = aiResponse.replace(/\D/g, '');
        return digits.length === 8 ? digits : null;
      }
    } catch (e) {
      console.error(e);
    }
    return null;
  }

  // ƏSAS DÜYMƏNİN FUNKSİYASI
  mainActionBtn.addEventListener('click', async () => {
    // 1. Əgər artıq Lot tapılıbsa, Düyməyə basanda Bitcars-a gedir
    if (currentFoundLot) {
      window.open(`https://bid.cars/en/search/archived/results?search-type=typing&query=${currentFoundLot}`, '_blank');
      return;
    }

    // 2. Əgər hələ tapılmayıbsa, Şəkli Çəkir
    mainActionBtn.disabled = true;
    mainActionBtn.innerText = '⏳ ƏLAQƏ QURULUR...';
    
    const base64Image = captureFrameBase64();
    video.pause();

    const lotCode = await askGeminiAI(base64Image);

    if (lotCode) {
      currentFoundLot = lotCode;
      statusEl.textContent = '✅ LOT TAPILDI!';
      
      // DÜYMƏ BİDCARS AXTARIŞINA ÇEVRİLİR
      mainActionBtn.classList.add('searching');
      mainActionBtn.innerHTML = `🚀 ${lotCode} - BID.CARS-DA AXTAR`;
      mainActionBtn.disabled = false;
    } else {
      statusEl.textContent = '❌ Lot tapılmadı. Zəhmət olmasa təkrar çəkin.';
      mainActionBtn.innerText = '📸 YENİDƏN ŞƏKİL ÇƏK';
      mainActionBtn.disabled = false;
    }

    retakeBtn.style.display = 'block';
  });

  retakeBtn.addEventListener('click', () => {
    video.play();
    currentFoundLot = null;
    statusEl.textContent = '📸 Çərçivəyə salıb düyməyə basın';
    mainActionBtn.classList.remove('searching');
    mainActionBtn.innerText = '📸 ŞƏKLİ ÇƏK VƏ ANALİZ ET';
    mainActionBtn.disabled = false;
    retakeBtn.style.display = 'none';
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    statusEl.textContent = 'Kamera başladılır...';
    try {
      await startCamera();
      startOverlay.style.display = 'none';
      statusEl.textContent = '📸 Çərçivəyə salıb düyməyə basın';
    } catch (err) {
      statusEl.textContent = 'Xəta: Kameraya icazə verilmədi.';
      startBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
