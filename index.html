<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VIN & Lot Multi-Scanner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  video, canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; background: #000;
  }
  
  #targetFrame {
    position: absolute;
    border: 3px solid #ffca28;
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  #panel {
    position: absolute; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom));
    padding: 0 20px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5;
  }
  #status { 
    font-size: 14px; color: #ffecb3; text-align: center; font-weight: 700; 
    background: rgba(0,0,0,0.85); padding: 8px 16px; border-radius: 20px;
  }

  /* ƏSAS DÜYMƏ / AXTARIŞ DÜYMƏLƏRİ CONTAINER-İ */
  #actionContainer {
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .btn {
    width: 100%; padding: 16px 12px; font-size: 16px; font-weight: 800;
    border: none; border-radius: 14px; text-align: center; cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    transition: all 0.2s ease; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .btn:active { transform: scale(0.96); }

  #scanBtn { background: #ffca28; color: #000; }
  
  #bidcarsBtn { background: #00ff9d; color: #000; display: none; }
  #googleBtn { background: #4285F4; color: #fff; display: none; }

  #retakeBtn {
    display: none; background: rgba(255,255,255,0.2); border: 1px solid #aaa;
    color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 4px;
  }

  #startOverlay {
    position: absolute; inset: 0; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 20; padding: 24px; text-align: center;
  }
  #startOverlay h1 { font-size: 24px; color: #ffca28; margin: 0; }
  #startOverlay p { font-size: 14px; color: #aaa; margin: 0; max-width: 300px; line-height: 1.5; }
  #startBtn {
    padding: 16px 40px; font-size: 18px; font-weight: 800; color: #000;
    background: #ffca28; border: none; border-radius: 14px; cursor: pointer;
  }
  #hiddenCanvas { display: none; }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="hiddenCanvas"></canvas>
  
  <div id="targetFrame"></div>

  <div id="panel">
    <div id="status">📸 VIN və ya Lot nömrəsini çərçivəyə salın</div>
    
    <div id="actionContainer">
      <button id="scanBtn" class="btn">📸 ŞƏKLİ ÇƏK VƏ ANALİZ ET</button>
      
      <!-- NƏTİCƏ TAPILANDA AÇILAN 2 DÜYMƏ -->
      <a id="bidcarsBtn" class="btn" target="_blank" rel="noopener">🚀 BID.CARS-DA AXTAR</a>
      <a id="googleBtn" class="btn" target="_blank" rel="noopener">🔍 GOOGLE-DA AXTAR</a>
    </div>
    
    <button id="retakeBtn">Yenidən Çək 🔄</button>
  </div>

  <div id="startOverlay">
    <h1>VIN & Lot Auto Scanner 🚗</h1>
    <p>VIN kod və Lot nömrəsi üçün Bid.cars və Google axtarış sistemi.</p>
    <button id="startBtn">Kameranı Aç</button>
  </div>
</div>

<script>
(function () {
  const video = document.getElementById('video');
  const hiddenCanvas = document.getElementById('hiddenCanvas');
  const targetFrame = document.getElementById('targetFrame');
  const statusEl = document.getElementById('status');
  
  const scanBtn = document.getElementById('scanBtn');
  const bidcarsBtn = document.getElementById('bidcarsBtn');
  const googleBtn = document.getElementById('googleBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  function layoutFrame() {
    const w = window.innerWidth, h = window.innerHeight;
    const frameW = Math.min(w * 0.90, 560);
    const frameH = frameW * 0.48;
    const left = (w - frameW) / 2, top = (h - frameH) / 2 - 80;
    targetFrame.style.width = frameW + 'px';
    targetFrame.style.height = frameH + 'px';
    targetFrame.style.left = left + 'px';
    targetFrame.style.top = top + 'px';
  }
  window.addEventListener('resize', layoutFrame);
  layoutFrame();

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  }

  function captureFrameBlob() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const iw = window.innerWidth, ih = window.innerHeight;

    const scale = Math.max(iw / vw, ih / vh);
    const rect = targetFrame.getBoundingClientRect();

    const frameX = (rect.left - (iw - vw * scale) / 2) / scale;
    const frameY = (rect.top - (ih - vh * scale) / 2) / scale;
    const frameW = rect.width / scale;
    const frameH = rect.height / scale;

    hiddenCanvas.width = frameW;
    hiddenCanvas.height = frameH;
    const ctx = hiddenCanvas.getContext('2d');
    ctx.drawImage(video, frameX, frameY, frameW, frameH, 0, 0, frameW, frameH);

    return new Promise(resolve => hiddenCanvas.toBlob(resolve, 'image/jpeg', 0.90));
  }

  async function scanImageOnline(imageBlob) {
    statusEl.textContent = '🧠 Şəkil analiz olunur...';
    
    const formData = new FormData();
    formData.append('file', imageBlob, 'photo.jpg');

    try {
      const response = await fetch('https://api.ocr.space/parse/image', {
        method: 'POST',
        headers: { 'apikey': 'K88383988888957' },
        body: formData
      });

      const data = await response.json();

      if (data && data.ParsedResults && data.ParsedResults.length > 0) {
        const text = data.ParsedResults[0].ParsedText;
        return extractCode(text);
      }
    } catch (e) {
      console.error(e);
    }
    return null;
  }

  // HEM VIN KODU (17 simvol), HƏM LOT NÖMRƏSİNİ (8 rəqəm) AXTARIR
  function extractCode(text) {
    if (!text) return null;
    const cleanText = text.replace(/[\r\n\s]+/g, ' ').toUpperCase();

    // 1. VIN Kod Axtarışı (17 Simvol: Standart VIN formatı I, O, Q istisna olmaqla)
    const vinMatch = cleanText.match(/\b[A-HJ-NPR-Z0-9]{17}\b/);
    if (vinMatch) {
      return { type: 'VIN', code: vinMatch[0] };
    }

    // 2. Lot Nömrəsi Axtarışı (8 Rəqəm)
    const lotMatch = cleanText.match(/\b\d{8}\b/);
    if (lotMatch) {
      return { type: 'LOT', code: lotMatch[0] };
    }

    return null;
  }

  scanBtn.addEventListener('click', async () => {
    scanBtn.disabled = true;
    scanBtn.innerText = '⏳ ANALİZ EDİLİR...';
    statusEl.textContent = '📸 Şəkil çəkilir...';

    const imageBlob = await captureFrameBlob();
    video.pause();

    const result = await scanImageOnline(imageBlob);

    if (result) {
      statusEl.textContent = `✅ ${result.type} TAPILDI: ${result.code}`;
      
      // Şəkil çəkmə düyməsini gizlədib 2 Axtarış düyməsini göstəririk
      scanBtn.style.display = 'none';

      // 1. Bid.cars Linki
      bidcarsBtn.href = `https://bid.cars/en/search/archived/results?search-type=typing&query=${result.code}`;
      bidcarsBtn.innerText = `🚀 ${result.code} - BID.CARS`;
      bidcarsBtn.style.display = 'flex';

      // 2. Google Linki
      googleBtn.href = `https://www.google.com/search?q=${encodeURIComponent(result.code)}`;
      googleBtn.innerText = `🔍 ${result.code} - GOOGLE`;
      googleBtn.style.display = 'flex';

    } else {
      statusEl.textContent = '❌ Nə VIN, nə de Lot nömrəsi tapılmadı. Yenidən çəkin.';
      scanBtn.innerText = '📸 YENİDƏN ŞƏKİL ÇƏK';
      scanBtn.disabled = false;
    }

    retakeBtn.style.display = 'block';
  });

  retakeBtn.addEventListener('click', () => {
    video.play();
    statusEl.textContent = '📸 VIN və ya Lot nömrəsini çərçivəyə salın';
    
    scanBtn.style.display = 'flex';
    scanBtn.innerText = '📸 ŞƏKLİ ÇƏK VƏ ANALİZ ET';
    scanBtn.disabled = false;

    bidcarsBtn.style.display = 'none';
    googleBtn.style.display = 'none';
    retakeBtn.style.display = 'none';
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    try {
      await startCamera();
      startOverlay.style.display = 'none';
      statusEl.textContent = '📸 VIN və ya Lot nömrəsini çərçivəyə salın';
    } catch (err) {
      statusEl.textContent = 'Xəta: Kameraya icazə verilmədi.';
      startBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
