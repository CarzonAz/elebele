<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lot Scanner - Bid.cars Archive</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }
  #app {
    position: fixed; inset: 0; width: 100%; height: 100%;
    background: #000;
  }
  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  /* Dim everything outside the target frame using a giant box-shadow */
  #targetFrame {
    position: absolute;
    border: 2px dashed #ffca28;
    border-radius: 10px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.72);
    pointer-events: none;
    transition: border-color 0.15s ease;
  }
  #targetFrame.found {
    border-color: #00ff9d;
    border-style: solid;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.72), 0 0 20px 4px rgba(0,255,157,0.6);
  }
  #scanLine {
    position: absolute;
    left: 4%; right: 4%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ffca28, transparent);
    top: 10%;
    pointer-events: none;
    animation: scanmove 2.2s ease-in-out infinite;
    opacity: 0.85;
  }
  @keyframes scanmove {
    0% { top: 6%; }
    50% { top: 94%; }
    100% { top: 6%; }
  }
  #panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 16px 18px calc(22px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 28%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    z-index: 5;
  }
  #status {
    font-size: 15px;
    color: #ffecb3;
    letter-spacing: 0.2px;
    min-height: 20px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #code {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    min-height: 30px;
  }
  #actionBtn {
    display: none;
    width: 100%;
    max-width: 420px;
    padding: 16px 10px;
    font-size: 18px;
    font-weight: 700;
    color: #000;
    background: #ffca28;
    border: none;
    border-radius: 14px;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 4px 18px rgba(255,202,40,0.35);
  }
  #actionBtn.show { display: block; animation: pop 0.25s ease; }
  @keyframes pop { from { transform: scale(0.9); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }

  #resetBtn {
    display: none;
    background: none;
    border: 1px solid #444;
    color: #ccc;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
  }
  #resetBtn.show { display: block; }

  #startOverlay {
    position: absolute; inset: 0;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 20; padding: 24px; text-align: center;
  }
  #startOverlay h1 { font-size: 20px; margin: 0 0 4px; color: #ffca28; }
  #startOverlay p { font-size: 14px; color: #999; margin: 0; max-width: 320px; line-height: 1.5; }
  #startBtn {
    margin-top: 10px;
    padding: 16px 34px;
    font-size: 17px;
    font-weight: 700;
    color: #000;
    background: #ffca28;
    border: none;
    border-radius: 14px;
  }
  #topbar {
    position: absolute; top: env(safe-area-inset-top); left: 0; right: 0;
    padding: 14px 16px; z-index: 5;
    font-size: 13px; color: #aaa; text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline muted autoplay></video>
  <div id="targetFrame"></div>
  <div id="scanLine"></div>

  <div id="topbar">8 rəqəmli Lot nömrəsini sarı çərçivəyə salın</div>

  <div id="panel">
    <div id="status">Hazırlanır...</div>
    <div id="code"></div>
    <a id="actionBtn" href="#" target="_blank" rel="noopener">Bid.cars Arxivində Aç 📁</a>
    <button id="resetBtn">Yenidən Skan Et</button>
  </div>

  <div id="startOverlay">
    <h1>Bid.cars Arxiv Skaneri</h1>
    <p>Kamera icazəsi tələb olunur. Başlamaq üçün düyməyə toxunun və avtomobil şüşəsindəki 8 rəqəmli lot kodunu çərçivəyə tuşlayın.</p>
    <button id="startBtn">Skana Başla</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function () {
  const video = document.getElementById('video');
  const targetFrame = document.getElementById('targetFrame');
  const statusEl = document.getElementById('status');
  const codeEl = document.getElementById('code');
  const actionBtn = document.getElementById('actionBtn');
  const resetBtn = document.getElementById('resetBtn');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  let worker = null;
  let scanning = false;
  let busy = false;
  let found = false;
  let scanTimer = null;

  // ---------- Target frame geometry (CSS) ----------
  function layoutFrame() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const frameW = Math.min(w * 0.82, 520);
    const frameH = frameW * 0.42;
    const left = (w - frameW) / 2;
    const top = (h - frameH) / 2;
    targetFrame.style.width = frameW + 'px';
    targetFrame.style.height = frameH + 'px';
    targetFrame.style.left = left + 'px';
    targetFrame.style.top = top + 'px';
    document.getElementById('scanLine').style.left = left + 'px';
    document.getElementById('scanLine').style.width = frameW + 'px';
  }
  window.addEventListener('resize', layoutFrame);
  layoutFrame();

  // ---------- Web Audio beep ----------
  let audioCtx = null;
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch (e) { /* ignore */ }
  }

  // ---------- Camera ----------
  let cameraRestarting = false;

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    stream.getVideoTracks().forEach((track) => {
      track.addEventListener('ended', () => restartCamera());
    });
  }

  async function restartCamera() {
    if (cameraRestarting || found) return;
    cameraRestarting = true;
    try {
      statusEl.textContent = 'Kamera bərpa olunur...';
      await startCamera();
      if (!scanning) startScanning();
    } catch (e) {
      statusEl.textContent = 'Kamera bərpa olunmadı, səhifəni yeniləyin.';
    } finally {
      cameraRestarting = false;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (!video.srcObject) return;
    const tracks = video.srcObject.getTracks();
    const live = tracks.some((t) => t.readyState === 'live');
    if (!live) {
      restartCamera();
    } else if (video.paused) {
      video.play().catch(() => restartCamera());
    }
  });
  window.addEventListener('pageshow', () => {
    if (video.srcObject && video.paused) {
      video.play().catch(() => restartCamera());
    }
  });

  const ANGLES = [0, -12, 12, -24, 24, -34, 34];

  // ---------- Grab a larger, oversized grayscale square around the frame ----------
  function getRawSquareCrop() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const iw = window.innerWidth, ih = window.innerHeight;
    if (!vw || !vh) return null;

    const scale = Math.max(iw / vw, ih / vh);
    const scaledW = vw * scale, scaledH = vh * scale;
    const offsetX = (iw - scaledW) / 2;
    const offsetY = (ih - scaledH) / 2;

    const rect = targetFrame.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const squareSidePx = rect.width * 1.2;

    const nSide = squareSidePx / scale;
    const nx = (cx - offsetX) / scale - nSide / 2;
    const ny = (cy - offsetY) / scale - nSide / 2;

    const UPSCALE = 2.4;
    const outSide = Math.max(1, Math.round(nSide * UPSCALE));

    const canvas = document.createElement('canvas');
    canvas.width = outSide;
    canvas.height = outSide;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(video, nx, ny, nSide, nSide, 0, 0, outSide, outSide);

    const imgData = ctx.getImageData(0, 0, outSide, outSide);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      d[i] = d[i + 1] = d[i + 2] = g;
    }
    ctx.putImageData(imgData, 0, 0);

    return { canvas, frameW: rect.width, frameH: rect.height };
  }

  // ---------- Rotate crop & binarize ----------
  function rotateAndBinarize(rawCanvas, angleDeg, outW, outH) {
    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.translate(outW / 2, outH / 2);
    ctx.rotate((angleDeg * Math.PI) / 180);
    ctx.drawImage(rawCanvas, -rawCanvas.width / 2, -rawCanvas.height / 2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const imgData = ctx.getImageData(0, 0, outW, outH);
    const d = imgData.data;
    let sum = 0;
    const gray = new Uint8ClampedArray(outW * outH);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      gray[p] = d[i];
      sum += d[i];
    }
    const mean = sum / gray.length;
    const threshold = mean * 0.92;
    for (let i = 0, p = 0; i < d.length; i += 4, p++) {
      const v = gray[p] > threshold ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    ctx.imageSmoothingEnabled = false;
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  // ---------- OCR loop ----------
  async function initWorker() {
    worker = await Tesseract.createWorker('eng', 1, { logger: () => {} });
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789xX',
      tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
    });
  }

  const EXACT_CODE = /^\d{8}[xX]?$/;
  const MIN_WORD_CONFIDENCE = 45;

  function extractCode(result) {
    const words = (result && result.data && result.data.words) || [];
    let best = null;
    for (const w of words) {
      const cleaned = (w.text || '').replace(/[^0-9xX]/g, '').toUpperCase();
      if (EXACT_CODE.test(cleaned) && (!best || w.confidence > best.confidence)) {
        best = { code: cleaned, confidence: w.confidence };
      }
    }
    if (best && best.confidence >= MIN_WORD_CONFIDENCE) return best.code;

    const cleanedAll = ((result && result.data && result.data.text) || '')
      .replace(/[^0-9xX]/g, '')
      .toUpperCase();
    return EXACT_CODE.test(cleanedAll) ? cleanedAll : null;
  }

  let candidateCode = null;
  let candidateHits = 0;

  async function scanLoop() {
    if (!scanning || found || busy) return;
    busy = true;
    const watchdog = setTimeout(() => { busy = false; }, 9000);
    try {
      const raw = getRawSquareCrop();
      if (raw) {
        const UPSCALE = 2.4;
        const outW = Math.max(1, Math.round(raw.frameW * UPSCALE));
        const outH = Math.max(1, Math.round(raw.frameH * UPSCALE * 1.3));

        let codeThisTick = null;
        for (const angle of ANGLES) {
          if (found) break;
          const canvas = rotateAndBinarize(raw.canvas, angle, outW, outH);
          const result = await worker.recognize(canvas);
          const code = extractCode(result);
          if (code) { codeThisTick = code; break; }
        }

        if (codeThisTick) {
          if (codeThisTick === candidateCode) {
            candidateHits++;
          } else {
            candidateCode = codeThisTick;
            candidateHits = 1;
          }
          if (candidateHits >= 2) {
            handleFound(candidateCode);
          } else {
            statusEl.textContent = 'Yoxlanılır: ' + candidateCode;
          }
        }
      }
    } catch (e) {
      // swallow single-frame errors
    }
    clearTimeout(watchdog);
    busy = false;
  }

  function startScanning() {
    scanning = true;
    candidateCode = null;
    candidateHits = 0;
    statusEl.textContent = 'Skan edilir...';
    scanTimer = setInterval(scanLoop, 650);
  }

  function stopScanning() {
    scanning = false;
    if (scanTimer) clearInterval(scanTimer);
    scanTimer = null;
  }

  // ---------- BID.CARS ARCHIVE INTEGRATION ----------
  function handleFound(code) {
    if (found) return;
    found = true;
    stopScanning();

    beep();
    targetFrame.classList.add('found');
    statusEl.textContent = 'Tapıldı: ' + code;
    codeEl.textContent = code;

    // Direct Bid.cars archived search URL (No API / CORS block)
    const bidCarsUrl = `https://bid.cars/en/search/archived/results?search-type=typing&query=${encodeURIComponent(code)}`;

    actionBtn.href = bidCarsUrl;
    actionBtn.classList.add('show');
    resetBtn.classList.add('show');

    // Automatically redirect after 700ms
    setTimeout(() => {
      window.location.href = bidCarsUrl;
    }, 700);
  }

  resetBtn.addEventListener('click', () => {
    found = false;
    targetFrame.classList.remove('found');
    codeEl.textContent = '';
    actionBtn.classList.remove('show');
    resetBtn.classList.remove('show');
    startScanning();
  });

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    statusEl.textContent = 'Kamera başladılır...';
    try {
      await startCamera();
      startOverlay.style.display = 'none';
      statusEl.textContent = 'OCR yüklənir...';
      await initWorker();
      startScanning();
    } catch (err) {
      statusEl.textContent = 'Xəta: kameraya icazə verilmədi.';
      startBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
